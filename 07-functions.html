        function greet(name) {

            if (!name) {
                console.log('Hello there!');
                return;
            } else {
                console.log(`Hello ${name}`);
            }
        }

        greet();


        function convertToFahrenheit(celsius) {
            return (celsius * 9 / 5) + 32;
        }

        console.log(convertToFahrenheit(25));

        function convertToCelsius(fahrenheit) {
            return (fahrenheit - 32) * 5 / 9;
        }

        console.log(convertToCelsius(86));

        function convertTemperature(degrees, unit) {
            if (unit === 'F') {
                return (degrees - 32) * 5 / 9 + '°C';
            } else if (unit === 'C') {
                return (degrees * 9 / 5) + 32 + '°F';
            } else {
                console.log('Invalid unit');
                return null;
            }
        }

        console.log(convertTemperature(25, 'C'));
        console.log(convertTemperature(86, 'F'));


        function convertLength(length, from, to) {
            if (from === 'miles' && to === 'km') {
                return length * 1.6 + ' km';

            } else if (from === 'miles' && to === 'feet') {
                return length * 5280 + ' feet';

            }
            else if (from === 'km' && to === 'miles') {
                return length / 1.6 + ' miles';

            }
            else if (from === 'km' && to === 'feet') {
                return length * 3281 + ' feet';

            }
            else if (from === 'feet' && to === 'miles') {
                return length / 5280 + ' miles';

            } else if (from === 'feet' && to === 'km') {
                return length / 3281 + ' km';

            }
            else if (from === to) {
                return length + ' ' + to;
            } else {
                console.log('Invalid unit');
                return null;
            }
        }

        console.log(convertLength(5, 'es', 'km'));
        console.log(convertLength(5, 'miles', 'feet'));
        console.log(convertLength(5, 'km', 'feet'));

    </script>
