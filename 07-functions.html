<body>
    <script>

        function greet(name) {
            if (!name) {
                console.log('Hello There')
            } else {
                console.log(`Hello ${name}`)
            }
        }

        greet()


        function convertToFahrenheit(celsius) {
            const fah = (celsius * 9 / 5) + 32
            console.log(`O valor em fahrenheit é ${fah}`)
        }

        convertToFahrenheit(25)

        function convertToCelsius(fah) {
            const cel = (fah - 32) * 5 / 9
            console.log(`O valor em Celsius é ${cel}`)
        }

        convertToCelsius(86)

        function convertToTemp(deg, unit) {
            if (unit === 'C') {
                convertToFahrenheit(deg)
            } else if (unit === 'F') {
                convertToCelsius(deg)
            }
        }

        convertToTemp(25, 'C')
        convertToTemp(86, 'F')

        function convertLength(length, from, to) {
            if (from != 'km' && from != 'miles' && from != 'feet') {
                return `Invalid unit: ${from}`
            } else if (to != 'km' && to != 'miles' && to != 'feet') {
                return `Invalid unit: ${to}`
            }

            if (from == 'km' && to == 'miles') {
                const dist = length / 1.6
                return (`${dist} miles`)
            } else if (from == 'miles' && to == 'km') {
                const dist = length * 1.6
                return (`${dist} km`)
            } else if (from == 'miles' && to == 'feet') {
                const dist = length * 5280
                return (`${dist} feet`)
            } else if (from == 'km' && to == 'feet') {
                const dist = length * 3281
                return (`${dist} feet`)
            } else if (from == 'feet' && to == 'km') {
                const dist = length / 3281
                return (`${dist} km`)
            } else if (from == 'feet' && to == 'miles') {
                const dist = length / 5280
                return (`${dist} miles`)
            } else if (from == to) {
                return (`${length} ${from}`)
            }
        }

        console.log(convertLength(5, 'miles', 'km'))
        console.log(convertLength(5, 'lbs', 'feet'))
        console.log(convertLength(5, 'miles', 'feet'))
    </script>
