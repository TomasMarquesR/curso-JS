<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>

<body>
    <p>
        <button onclick="
            updateCalculation('1');
        ">1</button>
        <button onclick="
            updateCalculation('2');
        ">2</button>
        <button onclick="
            updateCalculation('3');
        ">3</button>
        <button onclick="
            updateCalculation('+');
        ">+</button>
    </p>

    <p>
        <button onclick="
            updateCalculation('4');
        ">4</button>
        <button onclick="
            updateCalculation('5');
            console.log(calculation);
        ">5</button>
        <button onclick="
            updateCalculation('6');
            console.log(calculation);
        ">6</button>
        <button onclick="
            updateCalculation('-');
            console.log(calculation);
        ">-</button>
    </p>

    <p>
        <button onclick="
            updateCalculation('7');
            console.log(calculation);
        ">7</button>
        <button onclick="
            updateCalculation('8');
            console.log(calculation);
        ">8</button>
        <button onclick="
            updateCalculation('9');
            console.log(calculation);
        ">9</button>
        <button onclick="
            updateCalculation('*');
            console.log(calculation);
        ">*</button>
    </p>

    <p>
        <button onclick="
            updateCalculation('0');
            console.log(calculation);
        ">0</button>
        <button onclick="
            updateCalculation('.');
            console.log(calculation);
        ">.</button>
        <button onclick="
            updateCalculation('/');
            console.log(calculation);
        ">/</button>
        <button onclick="
            eval(calculation);
            calculation = eval(calculation);
            console.log(calculation);
        ">=</button>
    </p>

    <button onclick="
        calculation = '';
        console.log('Calculator was reset.');
        console.log(calculation);
    ">Clear</button>

    <script>
        let calculation = '';

        function updateCalculation(value) {
            calculation += value;
            console.log(calculation);
        }
    </script>
</body>

</html>
