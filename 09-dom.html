    <input type="text" placeholder="Name" class="js-name" onkeydown="
        keyEnter(event);
    ">
    <button onclick="
        findName();
    ">Submit</button>
    <p class="js-nome-tela"></p>

    <script>
        function keyEnter(enter) {
            if (event.key === 'Enter') {
                findName();
            }
        }


        function findName() {
            const inputName = document.querySelector('.js-name')

            document.querySelector('.js-nome-tela')
                .innerHTML = `Your name is: ${inputName.value}`
        }



        console.log(document.querySelector('button'));
