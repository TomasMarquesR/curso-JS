<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coins Game</title>
    <style>

    </style>

</head>

<body>

    <button onclick="
        document.querySelector('.js-coins-game')
            .innerHTML = `You chose Heads`
      playGame('heads')
    ">Heads</button>

    <button onclick="
        document.querySelector('.js-coins-game')
            .innerHTML = `You chose Tails`
         playGame('tails')
    ">Tails</button>
    <p class="js-coins-game"></p>

    <script>
        document.querySelector('.js-coins-game')
            .innerHTML = `You chose ${guess}`


        let score1 = JSON.parse(localStorage.getItem('score1')) || {
            wins: 0,
            losses: 0
        };

        function playGame(guess) {
            const randomNumber = Math.random();
            const result = randomNumber < 0.5 ? 'heads' : 'tails';

            console.log(guess === result ? 'You win!' : 'You lose');

            if (guess === result) {
                score1.wins++;
            } else {
                score1.losses++;
            }

            console.log(score1);

            localStorage.setItem('score1', JSON.stringify(score1));
        };

    </script>
</body>

</html>
