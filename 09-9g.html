<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challenge 9g</title>
    <style>

    </style>

</head>

<body>
    <p>Youtube Subscribe Button</p>
    <button onclick="
       subscribe();
    " class="js-subscribe-button">Inscrever-se</button>



    <p>Amazon Shipping Calculator</p>
    <p>Orders under $40 = +$10 shipping</p>
    <p>Orders over $40 = FREE shipping</p>
    <input type="number" placeholder="Cost of Order" class="js-cost-input" onkeydown="
        handleCostKeydown(event);
    ">
    <button onclick="
        calculateTotal();
    ">Calculate</button>

    <p class="js-total-cost"></p>

    <script>
        function handleCostKeydown(event) {
            if (event.key === 'Enter') {
                calculateTotal();
            }
        }

        function calculateTotal() {
            const inputElement = document.querySelector('.js-cost-input');
            let cost = Number(inputElement.value);

            if (cost <= 0) {
                alert(`ERRO! Valor Invalido`)
                document.querySelector('.js-total-cost')
                    .innerHTML = ``
                return
            } else if (cost < 40) {
                cost = cost + 10;
                let rcost = Number(cost.toFixed(2));
                document.querySelector('.js-total-cost')
                    .innerHTML = `$${rcost}`
            } else {
                let rcost = Number(cost.toFixed(2));
                document.querySelector('.js-total-cost')
                    .innerHTML = `$${rcost}`
            }


        }

        function subscribe() {
            const buttonElement = document.querySelector('.js-subscribe-button');

            if (buttonElement.innerText === 'Inscrever-se') {
                buttonElement.innerHTML = 'Inscrito';
            } else {
                buttonElement.innerHTML = 'Inscrever-se';
            }
        }   
    </script>
</body>

</html>
