<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buttons</title>
    <style>
        button {
            background-color: rgb(165, 165, 199);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: rgb(120, 120, 150);
        }

        .orange {
            background-color: orange;
            border: 1px solid black;
            color: black;
        }

        .yellow {
            background-color: yellow;
            border: 1px solid black;
            color: black;
        }
    </style>

</head>

<body>
    <button onclick="
       alert('Hello, World!'); 
        ">Hello</button>
    <p>Hello, World!</p>
    <p>Today I went to the grocery store to buy some eggs and vegetables.</p>
    <!--Comment-->


    <button>Click</button>

    <button>Tomas</button>
    <button>Hamburguer</button>

    <button class="yellow">Add to cart</button>
    <button class="orange">Buy Now</button>



    <script> //This is a comment.
        //This code creates a pop-up
        //alert('This is an alert box!');
        /*
        This is a multi-line comment.
        */

        console.log('Welcome');
    </script>
</body>

</html>
