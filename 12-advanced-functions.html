        document.querySelector('.startBtn')
            .addEventListener('click', () => {
                changes()
            })


        function changes() {
            document.querySelector('.startBtn').
                innerHTML = 'Loading...'


            const value = document.querySelector('.startBtn')

            setTimeout(() => {
                value.innerHTML = 'Finished!'
            }, 1000)
        }



        document.querySelector('.addClick1')
            .addEventListener('click', () => {
                Cart()
                add()
            })

        document.querySelector('.addClick2')
            .addEventListener('click', () => {
                remove()
            })


        let id
        function Cart() {
            document.querySelector('.addC').
                innerHTML = 'Added'

            clearTimeout(id)

            id = setTimeout(() => {
                document.querySelector('.addC').innerHTML = ''
            }, 2000)
        }
        let messages = 2

        function add() {
            messages++
        }

        function remove() {
            messages--
        }

        console.log(messages)

        setInterval(() => {
            const title = document.title

            if (messages <= 0) {
                document.title = 'Advanced Functions'

            } else if (title === 'Advanced Functions') {
                document.title = `(${messages}) New messages`

            } else {
                document.title = 'Advanced Functions'
            }

        }, 1000)

        function countPositive(nums) {
            let valor = 0
            nums.forEach((value, index) => {
                if (value > 0) {
                    valor++
                }

            })
            return valor

        const addNum = (array, num) => {

        function removeEggs(foods) {
            let num = 0
            return foods.filter(valor => {
                if (valor === 'egg' && num < 2) {

                    return false
