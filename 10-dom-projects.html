<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Projects</title>
    <link rel="stylesheet" href="styles/10-dom-projects.css">

</head>

<body>
    <p>Youtube Subscribe Button</p>
    <button onclick="
       subscribe();
    " class="js-subscribe-button subscribe-button">Subscribe</button>



    <p>Amazon Shipping Calculator</p>
    <input type="number" placeholder="Cost of Order" class="js-cost-input cost-input" onkeydown="
        handleCostKeydown(event);
    ">
    <button onclick="
        calculateTotal();
    " class="calculate-button">Calculate</button>

    <p class="js-total-cost"></p>
    <p class="js-error"></p>

    <br>

    <button class="amazonb">Add to Cart</button>

    <br>

    <button class="uber01">Request now</button>
    <button class="uber02">Schedule for later</button>

    <br><br>

    <button class="jsbtn">Test</button>

    <br>

    <button class="gaming" onclick="
        clickbtn('.gaming', '.music-js', '.tech-js')
    ">Gaming</button>

    <button class="music-js" onclick="
        clickbtn('.music-js', '.gaming', '.tech-js')
    ">Music</button>

    <button class="tech-js" onclick="
        clickbtn('.tech-js', '.gaming', '.music-js')
    ">Tech</button>





    <script src="scripts/10-dom-projects.js"></script>
</body>

</html>
